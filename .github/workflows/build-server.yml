name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  APP_VERSION: v1.0.${{ github.run_number }}

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESSE_TOKEN }}
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Verify cover letter static files
        run: |
          test -f dist/webapp/cover-letter.html
          test -f dist/webapp/js/cover-letter.js
      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install awscli --upgrade --user
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push site image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ env.APP_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
      - name: Build and push cover letter API image
        id: docker_build_pyapi
        uses: docker/build-push-action@v2
        with:
          context: ./pyapi
          file: ./pyapi/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cover-letter-agent:${{ env.APP_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cover-letter-agent:latest
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_INSTANCE_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml
          target: /home/ec2-user/regins-website
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_INSTANCE_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ec2-user/regins-website
            sudo /usr/local/bin/docker-compose down || true
            sed -i 's/image: ${{ secrets.DOCKERHUB_USERNAME }}\/backend:.*/image: ${{ secrets.DOCKERHUB_USERNAME }}\/backend:v1.0.${{ github.run_number }}/g' docker-compose.yml
            sed -i 's/image: ${{ secrets.DOCKERHUB_USERNAME }}\/cover-letter-agent:.*/image: ${{ secrets.DOCKERHUB_USERNAME }}\/cover-letter-agent:v1.0.${{ github.run_number }}/g' docker-compose.yml
            sudo /usr/local/bin/docker-compose pull || true
            sudo /usr/local/bin/docker-compose up -d || true
