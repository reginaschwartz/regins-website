# Compose file format 3.8 works with classic docker-compose 1.25+ on EC2.
# Avoid ${VAR:-default} — older binaries reject that interpolation.
version: "3.8"

services:
  website:
    build: .
    image: regins-website:latest
    container_name: regins-website
    ports:
      - "${WEB_PORT}:80"
    restart: unless-stopped

  whatsapp-bot:
    build: ./whatsapp-bot
    image: regins-whatsapp-bot:latest
    container_name: regins-whatsapp-bot
    ports:
      - "${BOT_PORT}:3000"
    env_file:
      - whatsapp-bot/env.env
    restart: unless-stopped
